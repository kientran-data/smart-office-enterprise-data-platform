services:

  source-postgres:
    image: postgres:16-alpine
    container_name: smart-office-source-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${SOURCE_POSTGRES_DB}
      POSTGRES_USER: ${SOURCE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SOURCE_POSTGRES_PASSWORD}

    ports:
      - "${SOURCE_POSTGRES_PORT}:5432"

    volumes:
      - source_postgres_data:/var/lib/postgresql/data
      - ./source/postgres/init:/docker-entrypoint-initdb.d:ro

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SOURCE_POSTGRES_USER} -d ${SOURCE_POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  source_postgres_data:
