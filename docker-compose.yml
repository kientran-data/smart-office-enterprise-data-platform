services:

  source-postgres:
    image: postgres:16-alpine
    container_name: smart-office-source-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${SOURCE_POSTGRES_DB}
      POSTGRES_USER: ${SOURCE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SOURCE_POSTGRES_PASSWORD}

    ports:
      - "${SOURCE_POSTGRES_PORT}:5432"

    volumes:
      - source_postgres_data:/var/lib/postgresql/data
      - ./source/postgres/init:/docker-entrypoint-initdb.d:ro

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SOURCE_POSTGRES_USER} -d ${SOURCE_POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  live-generator:
    build:
      context: .
      dockerfile: source/generator/Dockerfile
    depends_on:
      source-postgres:
        condition: service_healthy
    environment:
      SOURCE_POSTGRES_HOST: source-postgres
      SOURCE_POSTGRES_PORT: 5432
      PGUSER: smartoffice_admin
    env_file:
      - .env
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    container_name: smart-office-kafka
    hostname: kafka

    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: >
        CONTROLLER://:29093,
        PLAINTEXT://:19092,
        PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka:19092,
        PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"

    volumes:
      - kafka_data:/tmp/kraft-combined-logs

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  debezium-connect:
    image: quay.io/debezium/connect:3.6.1.Final
    container_name: smart-office-debezium-connect

    restart: unless-stopped

    ports:
      - "8083:8083"

    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: smartoffice-connect-cluster
      CONFIG_STORAGE_TOPIC: smartoffice_connect_configs
      OFFSET_STORAGE_TOPIC: smartoffice_connect_offsets
      STATUS_STORAGE_TOPIC: smartoffice_connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

    depends_on:
      kafka:
        condition: service_healthy
      source-postgres:
        condition: service_healthy

volumes:
  source_postgres_data:
  kafka_data:
